plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name + '-forge' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { playercollars { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { playercollars { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'playercollars.refmap.json'
    config 'playercollars.leashplayers.mixins.json'
    config 'playercollars.mixins.json'
}

repositories {
    mavenCentral()
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    maven { name = 'Ldtteam'; url = 'https://ldtteam.jfrog.io/artifactory/patchworkmc-maven/' }
    maven { name = 'Jared'; url = 'https://maven.blamejared.com' }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven { name = 'Kotlin for Forge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    // Curios
    maven { url = 'https://maven.theillusivec4.top/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.0"

    // Curios (Forge equivalent of Trinkets)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1:api")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")

    // MixinExtras (bundled via Forge 47.1+, but adding explicitly for safety)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

jar {
    manifest { attributes(['MixinConfigs': 'playercollars.leashplayers.mixins.json,playercollars.mixins.json']) }
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
    finalizedBy 'reobfJar'
}

sourceSets {
    main {
        resources {
            srcDirs += ['src/main/generated']
            exclude '.cache/**'
        }
    }
}
